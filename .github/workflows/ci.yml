name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry==2.2.1

      - name: Cache Poetry environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-python-3.11-poetry-2.2.1-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry check --lock
          poetry sync --with dev --no-interaction

      - name: Check code and repository hygiene
        run: poetry run pre-commit run --all-files --show-diff-on-failure

      - name: Run tests
        run: poetry run pytest -q
