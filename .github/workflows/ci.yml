name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  lint:
    name: Linters and pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry==2.2.1

      - name: Cache lint environment and hooks
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pre-commit
          key: ${{ runner.os }}-lint-python-3.11-poetry-2.2.1-${{ hashFiles('poetry.lock', '.pre-commit-config.yaml') }}

      - name: Install development tools
        run: |
          poetry check --lock
          poetry sync --only dev --no-interaction

      - name: Check code and repository hygiene
        run: poetry run pre-commit run --all-files --show-diff-on-failure

      - name: Check Python code
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

  tests:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      DEVICE: cpu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry==2.2.1

      - name: Cache Poetry environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-tests-python-3.11-poetry-2.2.1-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry check --lock
          poetry sync --with dev --no-interaction

      - name: Run tests
        run: poetry run pytest -q --junitxml=reports/ci/pytest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/ci/pytest.xml
          if-no-files-found: ignore
